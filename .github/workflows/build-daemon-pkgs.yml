# The heavy half of a daemon publish: build the port's package for every ABI the
# pkg repository serves. Called by publish-daemon.yml on every port change and by
# publish-plugin.yml when the tag pins a daemon newer than anything published (a
# pair publish). One artifact per ABI: daemon-pkg-freebsd-<major>-<arch>.
#
# The VMs run the FreeBSD BASE of the OPNsense series each major serves, not the
# newest point release: pkg stamps every package with the build host's
# __FreeBSD_version, and pkg on the target rejects anything newer than its own
# userland. The base releases are pinned in ci/freebsd<major>-opnsense.env; the
# series each major serves is named by the plugins_branch matrix in
# publish-plugin.yml and the gate matrix in pkg-deploy.yml; the authoritative
# base number is __FreeBSD_version in opnsense/src stable/<series>
# sys/sys/param.h.
#
# Series, majors, architectures, and generated matrices come from ci/platforms.toml.
# Add the separate package-base pin with ci/freebsd-pin.sh <base> opnsense,
# then run python3 ci/platforms.py --write. See DEVELOP.md for the policy.
name: Build daemon packages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    name: Package (freebsd${{ matrix.os }}-${{ matrix.arch.name }})
    runs-on: ubuntu-24.04
    # Measured across publish runs: KVM lanes 2-5 minutes plus ~9 of e2e,
    # arm64 13-14 plus ~12 (no GitHub runner offers KVM for aarch64 guests,
    # so rustc and the suite run under TCG).
    timeout-minutes: ${{ matrix.arch.kvm && 25 || 40 }}
    env:
      FREEBSD_VM_ARCH: ${{ matrix.arch.name }}
      FREEBSD_VM_VERSION: ${{ matrix.os }}-opnsense
    strategy:
      # A publish is all-or-nothing: one failed ABI cancels the rest, and the
      # deploy tail never runs.
      fail-fast: true
      matrix:
        # BEGIN platforms: freebsd-package
        os:
          - 14
          - 15
        arch:
          - {"name": "amd64", "abi": "amd64", "triple": "x86_64-unknown-freebsd", "kvm": true, "packages": "qemu-system-x86"}
          - {"name": "arm64", "abi": "aarch64", "triple": "aarch64-unknown-freebsd", "kvm": false, "packages": "qemu-system-arm qemu-efi-aarch64"}
        # END platforms
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare and launch FreeBSD
        run: ci/freebsd-ci-setup.sh
      - name: Wait for the VM
        run: ci/freebsd-vm.sh wait
      - name: Accept packages newer than the base
        run: ci/freebsd-vm.sh run 'echo IGNORE_OSVERSION=yes >> /usr/local/etc/pkg.conf'
      - name: Build the package from the port
        run: ci/freebsd-port-package.sh
      - name: Install and run
        run: ci/port-install.sh
      - name: Native e2e against the installed package
        run: ci/port-e2e.sh
      - name: Deinstall
        run: |
          ci/freebsd-vm.sh run 'pkg delete -y netflector'
      - name: Fetch the package
        run: |
          mkdir out
          ci/freebsd-vm.sh pull '/usr/ports/net/netflector/work/pkg/*.pkg' out/
          ls -l out/
      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: daemon-pkg-freebsd-${{ matrix.os }}-${{ matrix.arch.abi }}
          path: out/*.pkg
          if-no-files-found: error
      - name: VM console log
        if: always()
        run: ci/freebsd-vm.sh console
      - name: Crash summary
        if: always()
        run: ci/freebsd-vm.sh crash
