# Markdown feeds no build or lint, so there is nothing to run here.
#
# One of the path-filtered pipelines partitioning the tree; ci.yml takes the rest.
# Each reports the required check "Success": duplicate names are all-must-pass.
name: Docs CI

on:
  pull_request:
    paths:
      - '**/*.md'
      # The pipeline itself: changing it runs it.
      - '.github/workflows/ci-docs.yml'
  workflow_dispatch:

permissions: {}

jobs:
  success:
    name: Success
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Nothing to validate
        run: 'true'
