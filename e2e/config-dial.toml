log_level = "debug"

# A single DIAL entry, so netflector's SSDP relay carries the device's 200 OK exactly once (the shared
# config.toml's any-MAC [reflectors.discovery] entry would otherwise double-reflect it). DIAL requires ssdp.
[reflectors.dial-tv]
source_if = "nf_source"
target_if = "nf_target"
ssdp = true
dial = true
